- id: og-default
  path: public/og/default.png
  width: 1200
  height: 630
  format: png
  type: og
  priority: critical
  scope: in_scope
  audit_ref: "Action #1 in Priority Action Plan; section 3.3 OG image fail; section 6 (Images, score 15/100)"
  source_route: "(site-wide fallback)"
  source_files:
    - "src/app/layout.tsx:39"
    - "src/app/page.tsx:107"
    - "src/app/about/page.tsx:19"
    - "src/app/services/page.tsx:19"
    - "src/app/our-work/page.tsx:19"
    - "src/app/blog/page.tsx:21"
    - "src/app/blog/[slug]/page.tsx:174"
    - "src/app/our-work/construction-compliance-agent/page.tsx:21"
    - "src/app/our-work/circular-economy-platform/page.tsx:21"
    - "src/app/our-work/housing-services-corp/page.tsx:21"
  triggers:
    - "Every page (~41 URLs) references /og/default.png as the OG image, but the file does not exist."
    - "All LinkedIn/Slack/X shares of any page currently render with a broken/missing preview."
    - "public/og/README.md explicitly flags: 'default.png does not exist yet ... must be created before production deployment.'"
  earns_its_place: |
    Yes. Critical SEO + distribution miss. Every page on the site shares the same
    broken preview. Audit weights this as #1. One image fixes 41 broken previews.
  concept: |
    Wordmark lockup "alphabyte · AI" on off-white canvas, with the headline
    "AI consulting that compounds." set in Geist (large, tight tracking).
    Brand-blue accent on the word "compounds." Subtle byte-cube glyph motif
    in the lower-right corner at low opacity. Composition is editorial,
    centred-left, with generous whitespace. No photography.
  brand_guard:
    - "No purple/violet. No deep navy."
    - "No emoji. No stock photography."
    - "Wordmark must be paired with the icon (logo lockup is a unit)."
    - "Logo never on green; here it sits on canvas off-white."
    - "Brand-blue used as accent only, not a hero fill."
  composition:
    focal_zone: "Centre-left, headline dominates; logo top-left; glyph motif bottom-right"
    safe_areas:
      - "Left 60% holds headline + sub-line"
      - "Top-left 22% holds wordmark"
      - "Bottom-right 25% reserved for glyph or eyebrow"
  alt: "Alphabyte, AI consulting that compounds"
  performance_budget_kb: 200
  status: planned
  metadata_sidecar: public/og/default.json

